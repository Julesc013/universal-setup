name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  specification:
    name: specification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Programme evidence binds an immutable historical source commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spec/tools/requirements-ci.txt
      - name: Install specification validation dependency
        run: python -m pip install --requirement spec/tools/requirements-ci.txt
      - name: Validate specification
        run: python spec/tools/specctl.py validate
      - name: Check generated specification indexes
        run: python spec/tools/specctl.py index --check
      - name: Check specification integrity seal
        run: python spec/tools/specctl.py seal --check
      - name: Validate specification schemas
        run: python spec/tools/specctl.py schema-check
      - name: Run specification tool self-tests
        run: python -B -m unittest discover -s spec/tools/tests -v

  test:
    name: native-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15-intel
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Bind macOS fixtures to the real no-link temporary root
        if: runner.os == 'macOS'
        shell: bash
        run: echo "TMPDIR=$(python -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python tools/structure_policy_check.py
      - run: python tools/adversarial_coverage_check.py
      - run: cmake -S . -B build/smoke -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build/smoke --config Release --parallel
      - name: Observe disposable Windows NTFS volume and restricted service
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-lab-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe"
      - name: Retain disposable Windows publisher lab receipt
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-disposable-volume-probe
          path: ${{ runner.temp }}\usk-wu006-lab-probe.json
          if-no-files-found: warn
      - name: Execute reviewed selected payload and protected metadata in disposable Windows VM
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-metadata-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -InterruptAfterVisibleRecord
      - name: Retain selected publisher metadata observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-selected-metadata-probe
          path: ${{ runner.temp }}\usk-wu006-metadata-probe.json
          if-no-files-found: warn
      - name: Recover ordinary apply renamed before visible journal, without original source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-renamed-recovery-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -InterruptAfterRename
      - name: Retain renamed source-free recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-renamed-recovery-probe
          path: ${{ runner.temp }}\usk-wu006-renamed-recovery-probe.json
          if-no-files-found: warn
      - name: Recover prepared ordinary apply before publication without original source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-prepared-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -InterruptBeforePublish
      - name: Retain prepared operation observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-prepared-probe
          path: ${{ runner.temp }}\usk-wu006-prepared-probe.json
          if-no-files-found: warn
      - name: Replay an authenticated snapshot-only operation without original source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-snapshot-client-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -InterruptAfterStage
      - name: Retain authenticated snapshot-only recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-snapshot-client-probe
          path: ${{ runner.temp }}\usk-wu006-snapshot-client-probe.json
          if-no-files-found: warn
      - name: Replay an authenticated prepared operation without original source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-prepared-client-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -InterruptAfterRename
      - name: Retain authenticated prepared recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-prepared-client-probe
          path: ${{ runner.temp }}\usk-wu006-prepared-client-probe.json
          if-no-files-found: warn
      - name: Replay an authenticated visible-journal operation without original source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-visible-client-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -InterruptAfterVisibleRecord
      - name: Retain authenticated visible-journal recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-visible-client-probe
          path: ${{ runner.temp }}\usk-wu006-visible-client-probe.json
          if-no-files-found: warn
      - name: Complete ordinary caller-bound apply through the shared publisher
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-ordinary-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -HostileRights
      - name: Install from an authenticated reviewed authored source path
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-reviewed-source-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -ReviewedSource -InterruptAfterVisibleRecord
      - name: Retain reviewed authored-source observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-reviewed-source-probe
          path: ${{ runner.temp }}\usk-wu006-reviewed-source-probe.json
          if-no-files-found: warn
      - name: Complete a reviewed install through the registered service entry
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'task/usk-wu-006-') || startsWith(github.head_ref, 'task/usk-wu-014-')) }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-registered-service-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -PayloadBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_neutral_payload.exe" -ReviewedSource -RegisteredService -ConsumerAccess -MachineRequestClient
      - name: Retain registered service install observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'task/usk-wu-006-') || startsWith(github.head_ref, 'task/usk-wu-014-')) }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-registered-service-probe
          path: ${{ runner.temp }}\usk-wu006-registered-service-probe.json
          if-no-files-found: warn
      - name: Exclude the submitting non-admin from registered staging and publication
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-registered-nonadmin-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service_fault.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -ReviewedSource -RegisteredService -NonAdminClient -HostileRights
      - name: Retain registered non-admin submission observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-registered-nonadmin-probe
          path: ${{ runner.temp }}\usk-wu006-registered-nonadmin-probe.json
          if-no-files-found: warn
      - name: Recover an interrupted registered install without its source
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'task/usk-wu-006-') || startsWith(github.head_ref, 'task/usk-wu-014-')) }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-registered-poststage-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service_fault.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -ReviewedSource -RegisteredService -InterruptAfterStage
      - name: Retain registered interrupted recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'task/usk-wu-006-') || startsWith(github.head_ref, 'task/usk-wu-014-')) }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-registered-poststage-probe
          path: ${{ runner.temp }}\usk-wu006-registered-poststage-probe.json
          if-no-files-found: warn
      - name: Classify a terminated registered poststage request as unknown and recover it
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-registered-transport-loss-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service_fault.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -ReviewedSource -RegisteredService -InterruptAfterStage -TerminateAtPoststage
      - name: Retain registered transport-loss recovery observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-registered-transport-loss-probe
          path: ${{ runner.temp }}\usk-wu006-registered-transport-loss-probe.json
          if-no-files-found: warn
      - name: Refuse an unprotected reviewed-source target before any effect
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-unprotected-root-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -ReviewedSource -ExpectUnprotectedRefusal
      - name: Retain unprotected-root refusal observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-unprotected-root-probe
          path: ${{ runner.temp }}\usk-wu006-unprotected-root-probe.json
          if-no-files-found: warn
      - name: Exercise non-admin consumer access and partial-grant recovery
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-consumer-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_service.exe" -DeviceAclBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_lab_device_acl.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicApplyBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_candidate_context_smoke.exe" -ClientBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_client.exe" -PayloadBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_neutral_payload.exe" -ConsumerAccess -InterruptDuringConsumerAccess
      - name: Retain consumer access observations
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-consumer-probe
          path: ${{ runner.temp }}/usk-wu006-consumer-probe.json
          if-no-files-found: ignore
      - name: Retain ordinary operation observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-006-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-ordinary-probe
          path: ${{ runner.temp }}\usk-wu006-ordinary-probe.json
          if-no-files-found: warn
      - run: ctest --test-dir build/smoke -C Release --output-on-failure --parallel 4
      - name: Retain packaged machine service observation
        if: ${{ always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'task/usk-wu-013-') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu013-machine-bridge
          path: ${{ runner.temp }}\usk-wu013-machine-bridge.json
          if-no-files-found: error
      - run: python tools/strict_check.py
      - name: Static analysis
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck
          cppcheck --project=build/smoke/compile_commands.json --enable=warning,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=*:${{ github.workspace }}/external/zlib/upstream/* --suppress=throwInEntryPoint:${{ github.workspace }}/tests/native/*

  windows-win32:
    name: native-windows-win32
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: cmake -S . -B build/win32 -A Win32 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/win32 --config Release --parallel
      - run: ctest --test-dir build/win32 -C Release --output-on-failure --parallel 4
      - run: python tools/strict_check.py

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: >-
          cmake -S . -B build/sanitizer
          -DUSK_BUILD_APPS=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=-fsanitize=address,undefined
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
      - run: cmake --build build/sanitizer --parallel
      - run: ctest --test-dir build/sanitizer --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: >-
          cmake -S . -B build/fuzz
          -DUSK_BUILD_APPS=OFF
          -DUSK_BUILD_TESTS=OFF
          -DUSK_BUILD_FUZZERS=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build/fuzz --target usk_json_fuzz --parallel
      - run: build/fuzz/usk_json_fuzz -runs=1000 -max_len=4096
