name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  specification:
    name: specification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Programme evidence binds an immutable historical source commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spec/tools/requirements-ci.txt
      - name: Install specification validation dependency
        run: python -m pip install --requirement spec/tools/requirements-ci.txt
      - name: Validate specification
        run: python spec/tools/specctl.py validate
      - name: Check generated specification indexes
        run: python spec/tools/specctl.py index --check
      - name: Check specification integrity seal
        run: python spec/tools/specctl.py seal --check
      - name: Validate specification schemas
        run: python spec/tools/specctl.py schema-check
      - name: Run specification tool self-tests
        run: python -B -m unittest discover -s spec/tools/tests -v

  test:
    name: native-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15-intel
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Bind macOS fixtures to the real no-link temporary root
        if: runner.os == 'macOS'
        shell: bash
        run: echo "TMPDIR=$(python -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python tools/structure_policy_check.py
      - run: python tools/adversarial_coverage_check.py
      - run: cmake -S . -B build/smoke -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DUSK_QUALIFICATION_DIAGNOSTICS=OFF
        env:
          USK_TRUSTED_HOSTED_LAB: ${{ runner.os == 'Windows' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
      - run: cmake --build build/smoke --config Release --parallel
      - run: ctest --test-dir build/smoke -C Release --output-on-failure --parallel 4 --label-exclude '^publisher-qualification$'
      - run: python tools/strict_check.py
      - name: Static analysis
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck
          cppcheck --project=build/smoke/compile_commands.json --inline-suppr --enable=warning,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=*:${{ github.workspace }}/external/zlib/upstream/* --suppress=throwInEntryPoint:${{ github.workspace }}/tests/native/*

  # Development checkpoints require the core platform gates above. Publisher
  # qualification remains an independently failing result and is additionally
  # required by the main-only ruleset; no lab assertion or deadline is relaxed.
  publisher-qualification:
    name: publisher-qualification
    needs: test
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository || github.base_ref == 'main') }}
    runs-on: windows-2022
    steps:
      - name: Require the admitted same-repository hosted lab context
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: pwsh
        run: throw 'Publisher qualification requires an admitted same-repository pull request; qualification was not executed.'
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Build this job's actual checked-out merge source. Diagnostic binaries
      # have their own identity; no equality with the core build is claimed.
      - name: Qualify the named elevated controller actor before compilation
        id: controller_actor
        timeout-minutes: 2
        shell: pwsh
        run: ./tests/windows_publisher_controller_actor_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-controller-actor-qualification.json"
      - name: Retain controller actor qualification
        if: ${{ always() && (steps.controller_actor.outcome == 'success' || steps.controller_actor.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-controller-actor-qualification
          path: ${{ runner.temp }}\usk-controller-actor-qualification.json
          if-no-files-found: error
      - run: cmake -S . -B build/smoke -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DUSK_QUALIFICATION_DIAGNOSTICS=ON
        env:
          USK_TRUSTED_HOSTED_LAB: 'true'
      - run: cmake --build build/smoke --config Release --parallel
        id: publisher_build
      - name: Qualify packaged machine and registered controller publisher journeys
        id: publisher_hosted
        run: ctest --test-dir build/smoke -C Release --output-on-failure --label-regex '^publisher-qualification$' --no-tests=error
      - name: Retain native publisher qualification log
        if: ${{ always() && (steps.publisher_hosted.outcome == 'success' || steps.publisher_hosted.outcome == 'failure') && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-publisher-native-qualification-log
          path: build/smoke/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Retain packaged machine service observation
        if: ${{ always() && (steps.publisher_hosted.outcome == 'success' || steps.publisher_hosted.outcome == 'failure') && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-packaged-machine-bridge
          path: ${{ runner.temp }}\usk-wu006-packaged-machine-bridge.json
          if-no-files-found: error
      - name: Retain registered controller apply observation
        if: ${{ always() && (steps.publisher_hosted.outcome == 'success' || steps.publisher_hosted.outcome == 'failure') && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-controller-apply-bridge
          path: ${{ runner.temp }}\usk-wu006-controller-apply-bridge.json
          if-no-files-found: error
      # Each public group owns separate targets and cleanup. An earlier legacy
      # failure must not suppress the connected public path. Its original red
      # result remains; only a successful build admits these existing groups.
      - name: Install, reconnect, verify and recover through the ordinary publisher client
        id: install_reconnect_verify_and_recover_through_the_ordinary_publisher_client
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-public-install-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation
      - name: Retain ordinary publisher client observation
        if: ${{ always() && (steps.install_reconnect_verify_and_recover_through_the_ordinary_publisher_client.outcome == 'success' || steps.install_reconnect_verify_and_recover_through_the_ordinary_publisher_client.outcome == 'failure' || steps.install_reconnect_verify_and_recover_through_the_ordinary_publisher_client.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-public-install-probe
          path: ${{ runner.temp }}\usk-wu006-public-install-probe.json
          if-no-files-found: warn
      - name: Recover ordinary public requests after prepared and visible production loss
        id: recover_ordinary_public_requests_after_prepared_and_visible_production_loss
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: |
          $failures=@()
          foreach($phase in @('prepublish','postrename')) {
            try {
              ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-public-$phase-loss-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicPublicationLoss $phase
            } catch { $failures+=($phase+': '+$_.Exception.Message) }
          }
          if($failures.Count){throw ($failures -join '; ')}
      - name: Retain both ordinary public production loss observations
        if: ${{ always() && (steps.recover_ordinary_public_requests_after_prepared_and_visible_production_loss.outcome == 'success' || steps.recover_ordinary_public_requests_after_prepared_and_visible_production_loss.outcome == 'failure' || steps.recover_ordinary_public_requests_after_prepared_and_visible_production_loss.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-public-production-loss-probes
          path: ${{ runner.temp }}\usk-wu006-public-*-loss-probe.json
          if-no-files-found: error
      - name: Retain ordinary public state after payload drift and metadata collision
        id: retain_ordinary_public_state_after_payload_drift_and_metadata_collision
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: |
          $failures=@()
          foreach($profile in @('payload_changed','metadata_collision')) {
            try {
              ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-public-$profile-retention-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicPublicationLoss postrename -PublicPostRenameRefusal $profile
            } catch { $failures+=($profile+': '+$_.Exception.Message) }
          }
          if($failures.Count){throw ($failures -join '; ')}
      - name: Retain both ordinary public refusal observations
        if: ${{ always() && (steps.retain_ordinary_public_state_after_payload_drift_and_metadata_collision.outcome == 'success' || steps.retain_ordinary_public_state_after_payload_drift_and_metadata_collision.outcome == 'failure' || steps.retain_ordinary_public_state_after_payload_drift_and_metadata_collision.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-public-retained-refusal-probes
          path: ${{ runner.temp }}\usk-wu006-public-*-retention-probe.json
          if-no-files-found: error
      - name: Qualify standard-account public installation and source-free reentry
        id: qualify_standard_account_public_installation_and_source_free_reentry
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu006-standard-public-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardActiveInstallContention -PublicStandardStalePlanQualification
      - name: Retain standard-account public observation
        if: ${{ always() && (steps.qualify_standard_account_public_installation_and_source_free_reentry.outcome == 'success' || steps.qualify_standard_account_public_installation_and_source_free_reentry.outcome == 'failure' || steps.qualify_standard_account_public_installation_and_source_free_reentry.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu006-standard-public-probe
          path: ${{ runner.temp }}\usk-wu006-standard-public-probe.json
          if-no-files-found: warn
      # Each cohort creates its own owned volume, service and request. A failure
      # in another journey must not suppress these independent observations.
      # The actor-qualified build is required; every failure still fails this
      # job. All original assertions, deadlines and main gates remain.
      # Both runs use the same assertions and deadline; keep their receipts separate.
      - name: Qualify untraced standard-account fresh repair move and uninstall
        id: fresh_untraced
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-maintenance-fresh-untraced-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardMaintenanceQualification
      - name: Retain untraced fresh native maintenance observation
        if: ${{ always() && (steps.fresh_untraced.outcome == 'success' || steps.fresh_untraced.outcome == 'failure' || steps.fresh_untraced.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-fresh-untraced-probe
          path: ${{ runner.temp }}\usk-wu007-standard-maintenance-fresh-untraced-probe.json
          if-no-files-found: error
      - name: Observe standard-account fresh repair move and uninstall
        id: observe_standard_account_fresh_repair_move_and_uninstall
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_maintenance_thread_trace_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-maintenance-fresh-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -FreshQualification
      - name: Retain fresh native maintenance observation
        if: ${{ always() && (steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'success' || steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'failure' || steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-fresh-probe
          path: ${{ runner.temp }}\usk-wu007-standard-maintenance-fresh-probe.json
          if-no-files-found: error
      - name: Retain bounded fresh maintenance CPU and wait trace
        if: ${{ always() && (steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'success' || steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'failure' || steps.observe_standard_account_fresh_repair_move_and_uninstall.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-fresh-trace
          path: ${{ runner.temp }}\usk-wu007-maintenance-fresh-trace\retained\*
          if-no-files-found: error
          retention-days: 7
      # Keep the same recovery assertions and deadline with and without WPR.
      - name: Qualify untraced genuinely interrupted repair without its source archive
        id: recovery_untraced
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-maintenance-recovery-untraced-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardMaintenanceRecoveryQualification
      - name: Retain untraced ended-worker source-free maintenance observation
        if: ${{ always() && (steps.recovery_untraced.outcome == 'success' || steps.recovery_untraced.outcome == 'failure' || steps.recovery_untraced.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-recovery-untraced-probe
          path: ${{ runner.temp }}\usk-wu007-standard-maintenance-recovery-untraced-probe.json
          if-no-files-found: error
      - name: Recover a genuinely interrupted repair without its source archive
        id: recover_a_genuinely_interrupted_repair_without_its_source_archive
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_maintenance_thread_trace_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-maintenance-recovery-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -RecoveryCpuDiagnostic
      - name: Retain ended-worker source-free maintenance observation
        if: ${{ always() && (steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'success' || steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'failure' || steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-recovery-probe
          path: ${{ runner.temp }}\usk-wu007-standard-maintenance-recovery-probe.json
          if-no-files-found: error
      - name: Retain bounded ended-repair recovery CPU diagnostic
        if: ${{ always() && (steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'success' || steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'failure' || steps.recover_a_genuinely_interrupted_repair_without_its_source_archive.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-recovery-trace
          path: ${{ runner.temp }}\usk-wu007-maintenance-thread-trace\retained\*
          if-no-files-found: error
          retention-days: 7
      - name: Observe original shared initial maintenance intent before staging
        id: observe_original_shared_initial_maintenance_intent_before_staging
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-maintenance-initial-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardMaintenanceInitialQualification
      - name: Retain initial shared intent and conservative source-free refusal observation
        if: ${{ always() && (steps.observe_original_shared_initial_maintenance_intent_before_staging.outcome == 'success' || steps.observe_original_shared_initial_maintenance_intent_before_staging.outcome == 'failure' || steps.observe_original_shared_initial_maintenance_intent_before_staging.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-maintenance-initial-probe
          path: ${{ runner.temp }}\usk-wu007-standard-maintenance-initial-probe.json
          if-no-files-found: error
      - name: Qualify registered bootstrap process-loss takeover and preservation
        id: qualify_registered_bootstrap_process_loss_takeover_and_preservation
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-bootstrap-loss-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardBootstrapLoss
      - name: Retain registered standard-account bootstrap process-loss observation
        if: ${{ always() && (steps.qualify_registered_bootstrap_process_loss_takeover_and_preservation.outcome == 'success' || steps.qualify_registered_bootstrap_process_loss_takeover_and_preservation.outcome == 'failure' || steps.qualify_registered_bootstrap_process_loss_takeover_and_preservation.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: usk-wu007-standard-bootstrap-loss-probe
          path: ${{ runner.temp }}\usk-wu007-standard-bootstrap-loss-probe.json
          if-no-files-found: error
      - name: Qualify registered reentry after interruption of bootstrap preservation
        id: qualify_registered_reentry_after_interruption_of_bootstrap_preservation
        if: ${{ !cancelled() && steps.publisher_build.outcome == 'success' && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        run: ./tests/windows_publisher_lab_probe.ps1 -OutputPath "$env:RUNNER_TEMP\usk-wu007-standard-preservation-loss-probe.json" -ServiceBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service.exe" -ServiceControlBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_publisher_service_control.exe" -MachineBinary "$env:GITHUB_WORKSPACE\build\smoke\Release\usk_machine.exe" -PublicInstallation -PublicStandardClient -PublicStandardBootstrapPreservationLoss
      - name: Retain registered bootstrap preservation interruption observation
        if: ${{ always() && (steps.qualify_registered_reentry_after_interruption_of_bootstrap_preservation.outcome == 'success' || steps.qualify_registered_reentry_after_interruption_of_bootstrap_preservation.outcome == 'failure' || steps.qualify_registered_reentry_after_interruption_of_bootstrap_preservation.outcome == 'cancelled') && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
